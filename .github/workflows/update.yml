name: Update spread scanner

on:
  schedule:
    # 21:30 UTC on weekdays — ~30 min after the US market close (4pm ET).
    # GitHub cron is always UTC; adjust if you follow a different market.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # commit the refreshed report back to the repo
  pages: write                # deploy the dashboard to GitHub Pages
  id-token: write             # required by the Pages deploy action

concurrency:
  group: spread-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run scanner
        # Writes public/data/scan.json + signals.csv + charts.json. No HTML:
        # public/index.html and public/assets/ are hand-written and stay put.
        env:
          # Optional: create this repo secret to enable Slack/Discord alerts.
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python run.py

      - name: Refresh backtest
        run: python backtest.py --years 5

      - name: Sanity-check the generated JSON
        # A malformed payload would leave the dashboard blank with no error in
        # the run log, so fail here rather than deploying it.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          scan = json.loads(Path("public/data/scan.json").read_text(encoding="utf-8"))
          assert scan["schema_version"].startswith("2."), scan["schema_version"]
          assert scan["signals"], "scan.json has no signals"
          assert scan["reference"]["actions"], "scan.json is missing UI reference copy"
          missing = [s["ticker"] for s in scan["signals"] if not s.get("recommendation")]
          assert not missing, f"no recommendation for: {missing}"
          print(f"scan.json OK — {len(scan['signals'])} signals, counts {scan['counts']}")
          for name in ("charts", "backtest"):
              p = Path(f"public/data/{name}.json")
              if p.exists():
                  json.loads(p.read_text(encoding="utf-8"))
                  print(f"{name}.json OK")
          PY

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update spread scan ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public           # index.html + assets/ (checked in) + data/ (generated)

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
