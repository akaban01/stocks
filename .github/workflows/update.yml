name: Update spread scanner

on:
  schedule:
    # 21:23 UTC on weekdays. The US close is 21:00 UTC in winter and 20:00 in
    # summer, so this sits after both. GitHub cron is always UTC.
    #
    # The odd minute is deliberate: scheduled workflows are the lowest priority
    # on shared runners and are queued behind everything else, worst at :00 and
    # :30. Observed fire times for the old "30 21" were 21:48, 23:27, 23:28,
    # 00:42, 02:02, 03:13 and once 05:31 — a delay of up to eight hours. The
    # option feed empties out somewhere between 03:15 and 05:30 UTC, so that
    # last one produced a scan with no quotes in it.
    #
    # The delay is not something a schedule can fix, so the run also refuses to
    # publish a scan whose option data came back empty (see the validation step
    # below). If winter runs start failing that check, this is too close to the
    # close — move it later. The check makes that safe to find out.
    - cron: "23 21 * * 1-5"
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # commit the refreshed report back to the repo
  pages: write                # deploy the dashboard to GitHub Pages
  id-token: write             # required by the Pages deploy action

concurrency:
  group: spread-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Calibrate the score weights
        # Fits weights.json (the model run.py and backtest.py both load) and
        # public/data/calibration.json (the out-of-sample half of the "Does it
        # work?" tab). This step is why either exists: without it run.py fell
        # back to the hardcoded weights on every run and the tab read "not
        # generated yet" permanently, while the README described the fit as
        # part of the pipeline.
        #
        # Best-effort: a calibration that cannot fetch its history must not stop
        # the scan. run.py then scores with the built-in weights and says so.
        continue-on-error: true
        run: python calibrate.py

      - name: Run scanner
        # Writes public/data/scan.json + signals.csv + charts.json. No HTML:
        # public/index.html and public/assets/ are hand-written and stay put.
        # Alerts are only *staged* here (alert.json) — see the send step below.
        run: python run.py

      - name: Refresh backtest
        # Scores with the same weights.json run.py just used, so the live score
        # and the backtested score are the same function.
        run: python backtest.py --years 5

      - name: Sanity-check the generated JSON
        # A malformed payload would leave the dashboard blank with no error in
        # the run log, so fail here rather than deploying it.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from spread_scanner import leaps, report, strategy
          scan = json.loads(Path("public/data/scan.json").read_text(encoding="utf-8"))
          assert scan["schema_version"].startswith("2."), scan["schema_version"]
          assert scan["signals"], "scan.json has no signals"
          assert scan["reference"]["actions"], "scan.json is missing UI reference copy"
          missing = [s["ticker"] for s in scan["signals"] if not s.get("recommendation")]
          assert not missing, f"no recommendation for: {missing}"
          # The Spreads tab renders whatever is in `long_dated`. An empty run is
          # legitimate (not every name lists LEAPS), a malformed one is not.
          for sig in scan["signals"]:
              ld = sig.get("long_dated")
              if ld is None:
                  continue
              assert ld["expiry"] and ld["dte"] > 0, f"{sig['ticker']}: bad long-dated expiry"
              keys = {c["key"] for c in ld["candidates"]}
              assert ld["preferred"] in keys or ld["preferred"] is None, \
                  f"{sig['ticker']}: preferred {ld['preferred']} is not among {keys}"
              for c in ld["candidates"]:
                  assert c["legs"] and c["playbook"], f"{sig['ticker']}: {c['key']} is incomplete"
          # A scan whose option feed returned nothing is worth less than the last
          # good scan it would replace, so fail before the commit step and leave
          # the previous one published.
          health = report.option_data_health(scan["signals"])
          assert health["ok"], health["reason"]
          if health["priced"]:
              print(f"option data OK — {health['usable']}/{health['priced']} priced names "
                    f"have real quotes, median ATM IV {health['median_iv']}%")

          # The payload ships its own UI copy so an explanation can never drift from
          # the field it explains. That only holds if the copy in the file is the
          # copy the code currently defines — check it, here rather than in the
          # tests, because this runs *after* the step that regenerates the file.
          want = {"actions": report.ACTIONS, "premium_states": report.PREMIUM_STATES,
                  "glossary": report.GLOSSARY,
                  "playbook": {**strategy.PLAYBOOK, **leaps.PLAYBOOK}}
          for key, expected in want.items():
              got = scan["reference"].get(key, {})
              drifted = [k for k in expected if got.get(k) != expected[k]]
              assert not drifted, f"reference.{key} is stale for: {drifted}"
          assert scan["disclaimer"] == report.DISCLAIMER, "disclaimer copy is stale"

          ld = scan["long_dated"]
          print(f"scan.json OK — {len(scan['signals'])} signals, counts {scan['counts']}, "
                f"{ld['candidates']} long-dated spreads across {ld['tickers']} names, "
                "shipped copy matches the code")
          # A name kept by `annotate` mode is a name that failed the screen and is
          # on the page anyway, so it has to arrive carrying its verdict. A name
          # the screen could not reach carries an explicit "no verdict" instead —
          # that is a published state, not a missing one, so it is a warning here
          # rather than a reason to withhold the whole day's scan. Only a screen
          # that reached nothing at all is a broken pipeline.
          if scan["screen"].get("mode") in ("annotate", "filter"):
              missing = [s["ticker"] for s in scan["signals"] if not s.get("screen")]
              assert not missing, f"names published with no screen block at all: {missing}"
              unknown = scan["screen"].get("unknown") or []
              assert scan["screen"]["screened"] > len(unknown), \
                  "the screen produced no verdict for any name — the join is broken"
              if unknown:
                  print(f"::warning::{len(unknown)} name(s) published unscreened: {unknown}")
              print(f"screen OK — {scan['screen']['screened']} names carry a verdict, "
                    f"{scan['screen']['flagged_count']} flagged, {len(unknown)} unscreened")
          for name in ("charts", "backtest", "calibration"):
              p = Path(f"public/data/{name}.json")
              if p.exists():
                  json.loads(p.read_text(encoding="utf-8"))
                  print(f"{name}.json OK")

          # The Repeat test walks weekly.json by *position*: "eight weeks later"
          # is eight steps along the shared axis. That only holds while every
          # series is exactly as long as the axis, so assert it here rather than
          # let a short column quietly shift a name's windows by a week.
          weekly = Path("public/data/weekly.json")
          if weekly.exists():
              w = json.loads(weekly.read_text(encoding="utf-8"))
              n = len(w["weeks"])
              assert len(w["starts"]) == n, "weekly.json: the week axis and its dates disagree"
              for s in w["series"]:
                  for col in ("close", "high", "low"):
                      assert len(s[col]) == n, \
                          f"weekly.json: {s['ticker']}.{col} is {len(s[col])} long, axis is {n}"
              print(f"weekly.json OK — {w['count']} names over {n} weeks")
          PY

      - name: Send staged alerts
        # Deliberately *after* the validation step above. The alert says what to
        # trade, and it used to be posted from inside run.py — before anything
        # had checked the scan it describes, so a run whose option feed came back
        # empty (which CI then refuses to publish) had already notified Slack
        # about the prices in it.
        env:
          # Optional: create this repo secret to enable Slack/Discord alerts.
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python send_alerts.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update spread scan ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # The concurrency group makes a racing push unlikely, not impossible:
          # a manual dispatch, or any commit landing on the branch while the scan
          # ran, rejects this one and the day's data is lost with no retry. Rebase
          # onto whatever arrived and try again, with backoff.
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin and retrying"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** attempt))
          done
          echo "::error::could not push the refreshed scan after 4 attempts"
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public           # index.html + assets/ (checked in) + data/ (generated)

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
